name: Generate Android Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Release Keystore and Base64
        run: |
          keytool -genkeypair -v \
            -keystore 321-futbol-release.jks \
            -alias futbol321 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'Futbol321!2026' \
            -keypass 'Futbol321!2026' \
            -dname 'CN=3-2-1 Futbol, OU=Mobile, O=3-2-1 Futbol, L=Istanbul, ST=Istanbul, C=TR'

          base64 -w 0 321-futbol-release.jks > keystore-base64.txt

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 321-futbol-release-keystore
          path: |
            321-futbol-release.jks
            keystore-base64.txt
          if-no-files-found: error
