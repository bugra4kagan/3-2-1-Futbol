apply plugin: 'com.android.application'

android {
    namespace = "com.futbol321.challenge"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.futbol321.challenge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def ksFile = file('release.jks')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: findProperty('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: findProperty('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD') ?: findProperty('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def resolvedReleaseAdmobAppId = System.getenv('ADMOB_APP_ID') ?: System.getenv('VITE_ADMOB_APP_ID')
            def isMissingOrTestAdmob = !resolvedReleaseAdmobAppId || resolvedReleaseAdmobAppId.trim().startsWith('ca-app-pub-3940256099942544')
            if (isMissingOrTestAdmob && System.getenv('STRICT_ADMOB_RELEASE') == 'true') {
                throw new GradleException('Release build blocked: production ADMOB_APP_ID / VITE_ADMOB_APP_ID is required when STRICT_ADMOB_RELEASE=true.')
            }
            // Kapalı test release derlemesinde Google Test App ID fallback KESİNLİKLE enjekte edilmez
            manifestPlaceholders = [
                admobAppId: isMissingOrTestAdmob ? '' : resolvedReleaseAdmobAppId.trim()
            ]
            if (file('release.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            manifestPlaceholders = [
                admobAppId: 'ca-app-pub-3940256099942544~3347511713'
            ]
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-appcheck-playintegrity"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
